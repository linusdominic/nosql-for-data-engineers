name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --python 3.12 --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/unit -q

  integration:
    name: labs, checks and capstone against the containers
    needs: lint-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Fail instead of skipping when a database is unreachable.
      NOSQLDE_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --python 3.12 --locked
      - name: Start every database (same compose file as the guide)
        run: docker compose --profile ch02 --profile ch03 --profile ch04 --profile ch05 --profile ch06 up -d --wait
      - run: uv run pytest tests/integration -q
      - name: Container logs
        if: failure()
        run: docker compose --profile ch02 --profile ch03 --profile ch04 --profile ch05 --profile ch06 logs --tail 200
      - name: Stop containers
        if: always()
        run: docker compose --profile ch02 --profile ch03 --profile ch04 --profile ch05 --profile ch06 down -v
