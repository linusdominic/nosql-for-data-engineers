[project]
name = "nosqlde"
version = "0.3.0"
description = "Hands-on NoSQL for data engineers: MongoDB, Redis, Cassandra, DynamoDB Local and Neo4j, with pipelines into Parquet and DuckDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Linus Dominic Nathaniel" }]
dependencies = [
    "pymongo==4.20.0",
    "redis==8.1.0",
    "cassandra-driver==3.30.1",
    "boto3==1.44.6",
    "neo4j==6.4.1",
    "duckdb==2.0.0",
    "pyarrow==26.0.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.scripts]
nosqlde = "nosqlde.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nosqlde"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["lake", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# Long lines are left to the formatter; tables of example data read better unwrapped.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["nosqlde"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/nosqlde"]

[[tool.mypy.overrides]]
# These client libraries ship without type information.
module = ["cassandra.*", "boto3.*", "botocore.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose services (make up-capstone up-03 up-05 ...)"]
addopts = "-ra"
# Starlette now prefers httpx2 for its TestClient; httpx 0.28 still works and is what is pinned.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
